[package]
name = "ccchattttter"
version = "1.1.0"
edition = "2024"
description = "Keyboard chattering suppressor - GPUI port of ccchattttter"

[dependencies]
gpui = "0.2"
windows = { version = "0.62", features = [
    "Win32_Security",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_Media",
    "Win32_Media_Audio",
] }
crossbeam-channel = "0.5"
async-channel = "2"
parking_lot = "0.12"
tray-icon = "0.24"
rust-ini = "0.21"
image = { version = "0.25", default-features = false, features = ["ico"] }
rfd = "0.17"

[profile.release]
lto = "thin"
